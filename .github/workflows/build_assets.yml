name: build-assets

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      thirdparty_archive_url:
        description: "HTTPS URL to a zip file that already contains the Workbench WB_3DPARTY_PATH layout"
        required: false
        type: string

env:
  SOLUTION_FILE: MySQLWorkbench.sln
  MAIN_CSPROJ: frontend/windows/MySQLWorkbench/MySQLWorkbench.csproj
  CONFIGURATION: Release_OSS
  PLATFORM: x64

jobs:
  validate:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java for ANTLR tooling
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 4.5 reference assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 `
            -OutputDirectory tools `
            -ExcludeVersion

          $src = Join-Path $PWD "tools\Microsoft.NETFramework.ReferenceAssemblies.net45\build\.NETFramework\v4.5"
          if (!(Test-Path $src)) {
            throw "Reference assemblies were not restored into $src"
          }

          $dst = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.5"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path (Join-Path $src "*") -Destination $dst -Recurse -Force

      - name: Validate solution, project, and configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path $env:SOLUTION_FILE)) {
            throw "Solution file not found: $env:SOLUTION_FILE"
          }

          if (!(Test-Path $env:MAIN_CSPROJ)) {
            throw "Main project file not found: $env:MAIN_CSPROJ"
          }

          if (!(Test-Path "PrepareOutputDir.cmd")) {
            throw "PrepareOutputDir.cmd is required by the MySQLWorkbench post-build step."
          }

          $solutionText = Get-Content $env:SOLUTION_FILE -Raw
          $projectText = Get-Content $env:MAIN_CSPROJ -Raw

          if ($solutionText -notmatch [regex]::Escape('Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "MySQLWorkbench", "frontend\windows\MySQLWorkbench\MySQLWorkbench.csproj"')) {
            throw "MySQLWorkbench.sln does not reference frontend\windows\MySQLWorkbench\MySQLWorkbench.csproj as expected."
          }

          if ($solutionText -notmatch '(?m)^\s*Release_OSS\|x64 = Release_OSS\|x64\s*$') {
            throw "Solution configuration Release_OSS|x64 is missing from MySQLWorkbench.sln."
          }

          if ($solutionText -notmatch '\.Release_OSS\|x64\.Build\.0 = Release_OSS\|x64') {
            throw "Release_OSS|x64 is not marked as a buildable solution configuration."
          }

          if ($projectText -notmatch '(?s)<PropertyGroup Condition="''\$\(Configuration\)\|\$\(Platform\)'' == ''Release_OSS\|x64''">.*?<OutputPath>\.\.\\\.\.\\\.\.\\bin\\x64\\Release_OSS\\</OutputPath>') {
            throw "frontend/windows/MySQLWorkbench/MySQLWorkbench.csproj does not define Release_OSS|x64."
          }

          if ($projectText -notmatch '<TargetFrameworkVersion>v4\.5</TargetFrameworkVersion>') {
            throw "MySQLWorkbench.csproj no longer targets .NET Framework 4.5; update the workflow accordingly."
          }

          if ($projectText -notmatch [regex]::Escape('call "$(SolutionDir)PrepareOutputDir.cmd" $(SolutionDir) $(ConfigurationName) $(PlatformTarget)')) {
            throw "Expected PrepareOutputDir.cmd post-build invocation was not found in MySQLWorkbench.csproj."
          }

      - name: Validate hosted toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $null = Get-Command msbuild -ErrorAction Stop
          $null = Get-Command nuget -ErrorAction Stop
          $null = Get-Command java -ErrorAction Stop

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe was not found at $vswhere"
          }

          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsPath) {
            throw "Unable to locate a Visual Studio installation with MSBuild."
          }

          $toolset = Get-ChildItem (Join-Path $vsPath "MSBuild\Microsoft\VC") -Recurse -Filter Toolset.props |
            Where-Object { $_.FullName -match '[\\/]v142[\\/].*Toolset\.props$' } |
            Select-Object -First 1

          if (-not $toolset) {
            throw "Visual Studio v142 toolset was not found on the hosted runner."
          }

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          nuget restore $env:SOLUTION_FILE

      - name: Summarize validation outcome
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          @"
          Validation passed for:
          - Solution: $env:SOLUTION_FILE
          - Main project: $env:MAIN_CSPROJ
          - Configuration/platform: $env:CONFIGURATION|$env:PLATFORM
          - Hosted prerequisites: MSBuild, NuGet, Java, .NET Framework 4.5 reference assemblies, Visual Studio v142 toolset

          Assumption:
          - A full Windows build still requires the repository's external WB_3DPARTY_PATH bundle, which is not stored in this repository.
          - The build job below only runs for manual dispatch when a zip URL for that bundle is provided.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  build:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.thirdparty_archive_url != '' }}
    runs-on: windows-2022
    env:
      WB_3DPARTY_PATH: ${{ runner.temp }}\wb-3rdparty

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java for ANTLR tooling
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 4.5 reference assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 `
            -OutputDirectory tools `
            -ExcludeVersion

          $src = Join-Path $PWD "tools\Microsoft.NETFramework.ReferenceAssemblies.net45\build\.NETFramework\v4.5"
          $dst = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.5"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path (Join-Path $src "*") -Destination $dst -Recurse -Force

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          nuget restore $env:SOLUTION_FILE

      - name: Download third-party bundle archive
        shell: pwsh
        env:
          THIRD_PARTY_ARCHIVE_URL: ${{ inputs.thirdparty_archive_url }}
        run: |
          $ErrorActionPreference = "Stop"

          $archivePath = Join-Path $env:RUNNER_TEMP "wb-3rdparty.zip"
          Invoke-WebRequest -Uri $env:THIRD_PARTY_ARCHIVE_URL -OutFile $archivePath

          if (!(Test-Path $archivePath)) {
            throw "Third-party bundle archive was not downloaded."
          }

      - name: Extract and validate third-party bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archivePath = Join-Path $env:RUNNER_TEMP "wb-3rdparty.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "wb-3rdparty-extracted"

          if (Test-Path $extractRoot) {
            Remove-Item $extractRoot -Recurse -Force
          }

          Expand-Archive -Path $archivePath -DestinationPath $extractRoot -Force

          $candidateRoots = @($extractRoot)
          $candidateRoots += Get-ChildItem $extractRoot -Directory | Select-Object -ExpandProperty FullName

          $bundleRoot = $candidateRoots |
            Where-Object {
              (Test-Path (Join-Path $_ "include")) -and
              (Test-Path (Join-Path $_ "lib")) -and
              (Test-Path (Join-Path $_ "bin")) -and
              (Test-Path (Join-Path $_ "Python\Include\Python.h"))
            } |
            Select-Object -First 1

          if (-not $bundleRoot) {
            throw "No extracted directory matched the expected WB_3DPARTY_PATH layout."
          }

          $requiredPaths = @(
            "include\antlr4-runtime",
            "lib\antlr4-runtime.lib",
            "lib\mysqlcppconn.lib",
            "lib\ssh.lib",
            "Python\Include\Python.h",
            "Python\libs\python312.lib",
            "bin\antlr-4.13.2-complete.jar"
          )

          $missing = foreach ($relativePath in $requiredPaths) {
            $fullPath = Join-Path $bundleRoot $relativePath
            if (!(Test-Path $fullPath)) {
              $relativePath
            }
          }

          if ($missing) {
            $missingList = $missing -join ", "
            throw "The provided third-party bundle is missing required paths: $missingList"
          }

          New-Item -ItemType Directory -Force -Path $env:WB_3DPARTY_PATH | Out-Null
          Copy-Item -Path (Join-Path $bundleRoot "*") -Destination $env:WB_3DPARTY_PATH -Recurse -Force

      - name: Build Release_OSS x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          msbuild $env:SOLUTION_FILE `
            /m `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:WB_3DPARTY_PATH="$env:WB_3DPARTY_PATH" `
            /verbosity:minimal

      - name: Verify expected output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $expected = "bin\$env:PLATFORM\$env:CONFIGURATION\MySQLWorkbench.exe"
          if (!(Test-Path $expected)) {
            throw "Build finished but expected executable was not found at $expected"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySQLWorkbench-${{ env.CONFIGURATION }}-${{ env.PLATFORM }}
          path: bin/${{ env.PLATFORM }}/${{ env.CONFIGURATION }}/
          if-no-files-found: error
