on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release_OSS]

    env:
      SOLUTION_FILE: MySQLWorkbench.sln
      PLATFORM: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET Framework 4.5 reference assemblies
        run: |
          $ErrorActionPreference = "Stop"

          nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 `
            -OutputDirectory tools `
            -ExcludeVersion

          $src = Join-Path $PWD "tools\Microsoft.NETFramework.ReferenceAssemblies.net45\build\.NETFramework\v4.5"
          if (!(Test-Path $src)) { throw "Reference assemblies not found at $src" }

          $dst = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.5"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          Copy-Item -Path (Join-Path $src "*") -Destination $dst -Recurse -Force

          Write-Host "Installed .NET 4.5 reference assemblies into: $dst"
        shell: pwsh

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Optional but often helpful for older solutions that use packages.config
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore "${{ env.SOLUTION_FILE }}"
        shell: pwsh

      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\vcpkg-bincache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=C:\vcpkg-bincache" | Out-File $env:GITHUB_ENV -Append
          "VCPKG_BINARY_SOURCES=clear;files,C:\vcpkg-bincache,readwrite" | Out-File $env:GITHUB_ENV -Append

      - name: Restore vcpkg binary cache
        id: vcpkg-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg-bincache
          key: vcpkg-bincache-${{ runner.os }}-x64-cairo-glib-python3-boostlocale-boostsignals2-rapidjson-libxml2-libssh-swig
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-x64-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MSVC dependencies
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\vcpkg\installed\x64-windows"
          vcpkg install cairo:x64-windows glib:x64-windows python3:x64-windows `
            boost-locale:x64-windows boost-signals2:x64-windows `
            rapidjson:x64-windows libxml2:x64-windows `
            libssh:x64-windows swig:x64-windows --triplet x64-windows
          vcpkg integrate install

          $libxmlIncludeDir = Join-Path $root "include\libxml2"
          if (!(Test-Path (Join-Path $libxmlIncludeDir "libxml\tree.h"))) {
            throw "Expected libxml/tree.h not found under $libxmlIncludeDir"
          }
          "LIBXML2_INCLUDE_DIR=$libxmlIncludeDir" | Out-File $env:GITHUB_ENV -Append

          $pythonH = Get-ChildItem $root -Recurse -Filter Python.h -ErrorAction Stop |
            Select-Object -First 1
          $libxmlTree = Get-ChildItem $root -Recurse -Filter tree.h -ErrorAction Stop |
            Where-Object { $_.FullName -match '\\libxml\\tree\.h$' } |
            Select-Object -First 1
          Write-Output $pythonH
          "VCPKG_INCLUDE_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PYTHON_INCLUDE_DIR=$($pythonH.FullName | Split-Path -Parent)" | Out-File $env:GITHUB_ENV -Append
          "LIBXML2_INCLUDE_DIR=$($libxmlTree.FullName | Split-Path -Parent)" | Out-File $env:GITHUB_ENV -Append
        shell: pwsh

      - name: Save vcpkg binary cache
        if: always() # && steps.vcpkg-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg-bincache
          key: vcpkg-bincache-${{ runner.os }}-x64-cairo-glib-python3-boostlocale-boostsignals2-rapidjson-libxml2-libssh-swig

      # Build the whole solution so C++/vcxproj dependencies compile too
      - name: Build
        run: >
          $env:WB_3DPARTY_PATH = "${{ env.VCPKG_INCLUDE_DIR }}"

          msbuild "${{ env.SOLUTION_FILE }}"
          /m
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=${{ env.PLATFORM }}
          /p:AdditionalIncludeDirectories="${{ env.VCPKG_INCLUDE_DIR }}%3B${{ env.PYTHON_INCLUDE_DIR }}%3B${{ env.LIBXML2_INCLUDE_DIR }}"
          # /p:WB_3DPARTY_PATH=${{ env.VCPKG_INCLUDE_DIR }}
        shell: pwsh

      # Sanity check: confirm the EXE exists where your csproj outputs it
      - name: Verify EXE exists
        run: |
          $exe = "bin\x64\${{ matrix.configuration }}\MySQLWorkbench.exe"
          if (!(Test-Path $exe)) {
            Write-Host "Expected EXE not found at: $exe"
            Write-Host "Showing bin\x64 tree for debugging:"
            Get-ChildItem -Path "bin\x64" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            throw "Build completed but EXE not found."
          }
          Write-Host "Found: $exe"
        shell: pwsh

      # Upload the whole output directory (EXE + DLLs + content files)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySQLWorkbench-${{ matrix.configuration }}-x64
          path: bin\x64\${{ matrix.configuration }}\
          if-no-files-found: error
