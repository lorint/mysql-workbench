on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release_OSS]

    env:
      SOLUTION_FILE: MySQLWorkbench.sln
      PLATFORM: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET Framework 4.5 reference assemblies (workaround)
        run: |
          $ErrorActionPreference = "Stop"

          nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 `
            -OutputDirectory tools `
            -ExcludeVersion

          $src = Join-Path $PWD "tools\Microsoft.NETFramework.ReferenceAssemblies.net45\build\.NETFramework\v4.5"
          if (!(Test-Path $src)) { throw "Reference assemblies not found at $src" }

          $dst = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.5"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          Copy-Item -Path (Join-Path $src "*") -Destination $dst -Recurse -Force

          Write-Host "Installed .NET 4.5 reference assemblies into: $dst"
        shell: pwsh

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Optional but often helpful for older solutions that use packages.config
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore "${{ env.SOLUTION_FILE }}"
        shell: pwsh

      # Build the whole solution so C++/vcxproj dependencies compile too
      - name: Build
        run: >
          msbuild "${{ env.SOLUTION_FILE }}"
          /m
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=${{ env.PLATFORM }}
        shell: pwsh

      # Sanity check: confirm the EXE exists where your csproj outputs it
      - name: Verify EXE exists
        run: |
          $exe = "bin\x64\${{ matrix.configuration }}\MySQLWorkbench.exe"
          if (!(Test-Path $exe)) {
            Write-Host "Expected EXE not found at: $exe"
            Write-Host "Showing bin\x64 tree for debugging:"
            Get-ChildItem -Path "bin\x64" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            throw "Build completed but EXE not found."
          }
          Write-Host "Found: $exe"
        shell: pwsh

      # Upload the whole output directory (EXE + DLLs + content files)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySQLWorkbench-${{ matrix.configuration }}-x64
          path: bin\x64\${{ matrix.configuration }}\
          if-no-files-found: error
