on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release_OSS]

    env:
      SOLUTION_FILE: MySQLWorkbench.sln
      PLATFORM: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET Framework 4.5 reference assemblies
        run: |
          $ErrorActionPreference = "Stop"

          nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 `
            -OutputDirectory tools `
            -ExcludeVersion

          $src = Join-Path $PWD "tools\Microsoft.NETFramework.ReferenceAssemblies.net45\build\.NETFramework\v4.5"
          if (!(Test-Path $src)) { throw "Reference assemblies not found at $src" }

          $dst = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.5"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          Copy-Item -Path (Join-Path $src "*") -Destination $dst -Recurse -Force

          Write-Host "Installed .NET 4.5 reference assemblies into: $dst"
        shell: pwsh

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Optional but often helpful for older solutions that use packages.config
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore "${{ env.SOLUTION_FILE }}"
        shell: pwsh

      - name: Set up VCPKG binary cache, part 1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\vcpkg-bincache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=C:\vcpkg-bincache" | Out-File $env:GITHUB_ENV -Append
          "VCPKG_FEATURE_FLAGS=manifests,binarycaching"  | Out-File $env:GITHUB_ENV -Append
      - name: Set up VCPKG binary cache, part 2
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-bincache
          key: vcpkg-bincache-${{ runner.os }}-x64-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-x64-

      - name: Install MSVC dependencies
        run: |
          $ErrorActionPreference = "Stop"
          $env:VCPKG_ROOT = "C:\vcpkg"
          vcpkg install cairo:x64-windows glib:x64-windows python3:x64-windows boost-locale:x64-windows --triplet x64-windows
          vcpkg integrate install

          $env:VCPKG_CAIRO_INCLUDE_DIR = Join-Path $env:VCPKG_ROOT "installed\x64-windows"
          "VCPKG_CAIRO_INCLUDE_DIR=$env:VCPKG_CAIRO_INCLUDE_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      # Build the whole solution so C++/vcxproj dependencies compile too
      - name: Build
        run: >
          msbuild "${{ env.SOLUTION_FILE }}"
          /m
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=${{ env.PLATFORM }}
          /p:WB_3DPARTY_PATH=${{ env.VCPKG_CAIRO_INCLUDE_DIR }}
        shell: pwsh

      # Sanity check: confirm the EXE exists where your csproj outputs it
      - name: Verify EXE exists
        run: |
          $exe = "bin\x64\${{ matrix.configuration }}\MySQLWorkbench.exe"
          if (!(Test-Path $exe)) {
            Write-Host "Expected EXE not found at: $exe"
            Write-Host "Showing bin\x64 tree for debugging:"
            Get-ChildItem -Path "bin\x64" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            throw "Build completed but EXE not found."
          }
          Write-Host "Found: $exe"
        shell: pwsh

      # Upload the whole output directory (EXE + DLLs + content files)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySQLWorkbench-${{ matrix.configuration }}-x64
          path: bin\x64\${{ matrix.configuration }}\
          if-no-files-found: error
